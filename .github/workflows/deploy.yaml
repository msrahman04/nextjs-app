# CI/CD pipeline:
# 1. Build the Next.js Docker image
# 2. Push it to Docker Hub
# 3. Update the GitOps repo
# 4. Argo CD detects the GitOps change and deploys to EKS

name: Build and Push Docker Image

# ------------------------------------------------------------
# When this pipeline runs:
# - Push to main
# - Push a v* tag
# - Pull request targeting main
# ------------------------------------------------------------
on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

# Docker Hub repository
env:
  IMAGE_NAME: shahinur093/nextjs-app

jobs:

  # ==========================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ==========================================================
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ------------------------------------------------------
      # Checkout application source code
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Set up QEMU for multi-platform Docker builds
      # ------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ------------------------------------------------------
      # Set up Docker Buildx
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # Login to Docker Hub
      #
      # Skip login for Pull Requests because nothing is pushed.
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------
      # Generate Docker image tags and OCI labels
      #
      # main:
      #   latest
      #   sha-<commit>
      #
      # branch:
      #   <branch-name>
      #
      # pull request:
      #   pr-<number>
      #
      # version tag:
      #   <version>
      #
      # Example:
      #   sha-a1b2c3d
      # ------------------------------------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # ------------------------------------------------------
      # Build Docker image
      #
      # Platforms:
      #   linux/amd64
      #   linux/arm64
      #
      # Push:
      #   Only for push events
      #
      # Pull Requests:
      #   Build only, no push
      # ------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # GitHub Actions layer cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------
      # Update Docker Hub repository README
      #
      # Only runs on main branch pushes.
      # ------------------------------------------------------
      - name: Update Docker Hub repository overview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB.md
          short-description: "A Next.js app packaged as a Docker image"


  # ==========================================================
  # JOB 2: UPDATE GITOPS REPOSITORY
  # ==========================================================
  #
  # This job:
  # 1. Waits for Docker build/push to finish
  # 2. Checks out the GitOps repository
  # 3. Updates deployment.yaml with the new immutable image tag
  # 4. Commits the change
  # 5. Pushes it to GitHub
  #
  # Argo CD watches this GitOps repository.
  # When the manifest changes, Argo CD deploys the new image
  # to EKS.
  # ==========================================================
  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest

    # Only run on pushes to main.
    #
    # Do NOT run:
    # - Pull Requests
    # - Git tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # Checkout GitOps repository
      # ------------------------------------------------------
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: msrahman04/k8s-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      # ------------------------------------------------------
      # Update Docker image tag in Kubernetes deployment
      # ------------------------------------------------------
      - name: Bump nextjs-app image tag
        run: |
          set -euo pipefail

          # Get the same short SHA used by docker/metadata-action
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          # New immutable Docker image
          NEW_IMAGE="${IMAGE_NAME}:sha-${SHORT_SHA}"

          # Kubernetes deployment manifest
          MANIFEST="apps/nextjs-app/k8s/deployment.yaml"

          echo "Updating image to: ${NEW_IMAGE}"

          # Replace the existing image tag
          sed -i -E "s|image: ${IMAGE_NAME}:.*|image: ${NEW_IMAGE}|" "${MANIFEST}"

          # --------------------------------------------------
          # Configure Git identity
          # --------------------------------------------------
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------
          # Stage the updated manifest
          # --------------------------------------------------
          git add "${MANIFEST}"

          # --------------------------------------------------
          # Exit if there is no change
          # --------------------------------------------------
          if git diff --cached --quiet; then
            echo "No image change to commit."
            exit 0
          fi

          # --------------------------------------------------
          # Commit the new image version
          # --------------------------------------------------
          git commit -m "Deploy nextjs-app ${NEW_IMAGE}"

          # --------------------------------------------------
          # Push change to GitOps repository
          # --------------------------------------------------
          git push
